<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ecece8" />
    <meta name="description" content="INXMD Lookbook — a responsive editorial grid for arranging 30 monochrome portraits." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="INXMD / Lookbook" />
    <meta property="og:description" content="Arrange 30 monochrome INXMD portraits in a responsive editorial grid." />
    <meta property="og:image" content="assets/og-preview.png" />
    <meta property="og:image:alt" content="Thirty monochrome INXMD portraits arranged in a studio lookbook grid." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INXMD / Lookbook" />
    <meta name="twitter:description" content="Arrange 30 monochrome INXMD portraits in a responsive editorial grid." />
    <meta name="twitter:image" content="assets/og-preview.png" />
    <link rel="icon" href="assets/inxmd-mark.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="assets/inxmd-mark.svg" color="#151515" />
    <link rel="manifest" href="site.webmanifest" />
    <title>INXMD / Lookbook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="site-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">INXMD / LOOKBOOK 30</p>
          <h1>Arrange the lookbook</h1>
        </div>
        <div class="actions" aria-label="Lookbook controls">
          <button id="shuffleButton" class="button button-dark" type="button">Shuffle</button>
          <button id="resetButton" class="button" type="button">Reset</button>
        </div>
      </header>

      <section class="intro" aria-label="Instructions">
        <p>Thirty monochrome portraits arranged as a flexible editorial lookbook. Drag any portrait onto another to swap their places.</p>
        <p>On touch screens, tap two portraits. Use the arrow keys after selecting a tile.</p>
        <p id="status" class="status" aria-live="polite">30 portraits / 6 × 5 grid</p>
      </section>

      <section id="grid" class="lookbook-grid" aria-label="Draggable lookbook portraits"></section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
